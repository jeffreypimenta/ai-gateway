services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init_env.py first}
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 12

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.102.1}
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"  # do not expose the development gateway publicly
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Run python3 scripts/init_env.py first}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Run python3 scripts/init_env.py first}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?Run python3 scripts/init_env.py first}@db:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
